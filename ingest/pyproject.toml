[project]
name = "ingest"
version = "0.1.0"
description = "Where's the Money? — upstream data ingest scripts"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "tenacity>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
